[project]
name = "metalmind-vault-rag"
version = "0.3.1"
description = "Obsidian vault RAG service for metalmind - MCP server, watcher, indexer, doctor."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "qdrant-client>=1.9",
    "mcp>=1.0",
    "watchfiles>=0.22",
    # sqlite-vec ships a SQLite extension wheel; loaded at runtime via
    # connection.enable_load_extension. ~3 MB, no native build step. v0.5.0
    # makes this the default vector store; Qdrant stays as a legacy backend.
    "sqlite-vec>=0.1.6",
    # fastembed runs ONNX embedding models in-process. Default model
    # (BAAI/bge-small-en-v1.5, 384-dim, ~30 MB) auto-downloads to
    # ~/.cache/fastembed/ on first use. v0.5.0 makes this the default
    # embedding backend; Ollama stays as a legacy backend.
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# `rerank` is the cross-encoder rescore tier. Opt-in - the default install
# stays slim. Users enable via `uv tool install 'metalmind-vault-rag[rerank]'`.
#
# As of v0.5.2 we run the reranker through onnxruntime + the Rust-backed
# tokenizers crate, dropping the FlagEmbedding + transformers + torch stack
# (~2 GB) for ~60 MB of native binaries. The model itself stays the same:
# BAAI's bge-reranker-v2-m3, served via the Xenova ONNX export.
rerank = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface_hub>=0.20",
]

[project.scripts]
metalmind-vault-rag-server = "metalmind_vault_rag.server:main"
metalmind-vault-rag-watcher = "metalmind_vault_rag.watcher:main"
metalmind-vault-rag-indexer = "metalmind_vault_rag.indexer:main"
metalmind-vault-rag-doctor = "metalmind_vault_rag.doctor:main"
metalmind-vault-rag-http = "metalmind_vault_rag.http_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metalmind_vault_rag"]
